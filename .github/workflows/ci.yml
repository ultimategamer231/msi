name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, typecheck, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high

  database:
    name: Database tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (migrations and seeds applied)
        run: pnpm db:start
      - name: PL/pgSQL lint
        run: pnpm supabase db lint --level warning --fail-on warning
      - name: Supabase advisors (fail on warnings and errors; R-12)
        run: pnpm supabase db advisors --type all --level warn --fail-on warn
      - name: pgTAP tests
        run: pnpm test:db
      - name: Generated database types are current
        run: pnpm types && git diff --exit-code src/types/database.ts
      - if: always()
        run: pnpm db:stop

  e2e:
    name: Playwright smoke and accessibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start local Supabase (migrations and seeds applied)
        run: pnpm db:start
      - name: Export local Supabase URL and keys (local stack only, fixed demo keys)
        run: |
          pnpm -s supabase status -o json > "$RUNNER_TEMP/supabase.json"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/supabase.json")"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY "$RUNNER_TEMP/supabase.json")"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r .SERVICE_ROLE_KEY "$RUNNER_TEMP/supabase.json")"
          } >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          CI: "true"
      - name: End-to-end smoke (SPEC 12.3; moves the business clock, so it runs alone)
        run: pnpm test:smoke
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: pnpm db:stop
